name = "sykasif-runtime"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sykasif-runtime"
database_id = "4e06e738-aae8-4145-bdd5-845d09157227"

[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

[vars]
APP_ORIGIN = "https://sykasif-ozeluclu.vercel.app,https://sykasif-ozeluclu-git-main-sy-kasif.vercel.app,https://sykasif-doga.vercel.app,http://localhost:5173"
