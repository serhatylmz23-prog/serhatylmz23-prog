name = "sykasif-runtime"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sykasif-runtime"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

[vars]
APP_ORIGIN = "http://localhost:5173"
